services:
  - type: web
    name: swiftycare-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://demo.swifty-care.com
    autoDeploy: true

